name = "mesoameri-ca"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Crons:
#  - 13:00 UTC (7:00am CR): buscar concursos, clasificar, guardar y enviar correo
#  - cada 2 horas: completar el detalle (presupuesto, tipo, etc.) de los pendientes
[triggers]
crons = ["0 13 * * *", "0 */2 * * *"]

# D1 — base de datos SQLite serverless
# Correr: wrangler d1 create mesoamerica-db
# Y pegar el id que devuelve.
[[d1_databases]]
binding = "DB"
database_name = "mesoamerica-db"
database_id = "f81c5c39-c605-4ea2-be52-bd7322fd76eb"

# Variables públicas (cambialas desde el dashboard o con wrangler secret)
[vars]
USER_AGENT = "mesoamerica-bot/0.1 (+contact: set CONTACT_EMAIL secret)"
# Categorías a incluir en el digest, separadas por coma
RELEVANT_CATEGORIES = "urbanismo,ambiental,residuos,agua-saneamiento,obra-publica"
# Base para los enlaces del correo (cambiar al dominio propio cuando exista)
PUBLIC_URL = "https://mesoameri-ca.buenaventurag650gs.workers.dev"

# Secrets (configurar aparte con: wrangler secret put NOMBRE o en el dashboard)
# - CONTACT_EMAIL        → email para User-Agent (requerido por algunos portales)
# - ADMIN_TOKEN          → token para endpoints /admin/*
# - RESEND_API_KEY       → API key de Resend para enviar el correo del digest
# - DIGEST_EMAIL_TO      → destinatario(s) del digest (coma-separado)
# - DIGEST_EMAIL_FROM    → remitente verificado (opcional; por defecto onboarding@resend.dev)
